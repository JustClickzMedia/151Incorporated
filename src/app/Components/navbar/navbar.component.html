<!-- navbar-expand-lg: from 992px up the menu is a regular horizontal menu and the hamburger is hidden -->
<nav id="header" class="navbar navbar-expand-lg fixed-top">
  <div id="header-container" class="container navbar-container">
    <a class="navbar-brand mr-0" routerLink=""><img class="d-block w-100" src="https://tzin.brothersof1-5-1.org/wp-content/uploads/2024/04/Brothers-of-1-5-1-Incorporated-219-x-52-px-1.png" alt="Brothers of 1-5-1 Incorporated"/></a>
    <button class="navbar-toggler ml-auto custom-toggler" type="button" (click)="toggleNavbar()" [ngStyle]="{'border-color': buttonbrdcolor() }">
      <span class="navbar-toggler-icon" [ngStyle]="{'background-image': iconlnimage() }"></span>
    </button>
    <div class="collapse navbar-collapse" [ngClass]="{ 'show': navbarOpen() }">
      <!-- Menu order: HOME, the WordPress pages, then MEMBERSHIP (a dropdown with the Membership page and Pay Dues) -->
      <ul class="navbar-nav mr-auto">
        <li class="nav-item" [routerLinkActive]="['active']" [routerLinkActiveOptions]="{exact:true}">
          <a class="nav-link" (click)="closeNavbar()" routerLink="/">HOME</a>
        </li>
        @for (NavItem of pageMenu(); track NavItem.id) {
          <li class="nav-item" [routerLinkActive]="['active']" [routerLinkActiveOptions]="{exact:true}">
            <a class="nav-link" (click)="closeNavbar()" [routerLink]="['/pg', NavItem.slug]">{{ menuLabel(NavItem) | uppercase }}</a>
          </li>
        }
        <li class="nav-item dropdown membership-menu" [class.active]="membershipActive()">
          <button type="button" class="nav-link dropdown-toggle" id="membership-toggle"
                  [attr.aria-expanded]="membershipOpen()" aria-haspopup="true" aria-controls="membership-menu"
                  (click)="toggleMembership($event)">MEMBERSHIP</button>
          <ul class="dropdown-menu" id="membership-menu" aria-labelledby="membership-toggle" [class.show]="membershipOpen()">
            <li><a class="dropdown-item" (click)="closeNavbar()" routerLink="/pg/membership">Membership Requirements</a></li>
            <!-- Opens the Square checkout in a pop-up frame (the href is only a fallback, e.g. middle-click) -->
            <li><a class="dropdown-item" [href]="payDuesUrl" (click)="openPayDues($event)">Pay Dues</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Pay Dues pop-up: Square checkout in a frame over the page -->
@if (payDuesOpen()) {
  <div class="paydues-backdrop" (click)="closePayDues()"></div>
  <div class="paydues-modal" role="dialog" aria-modal="true" aria-labelledby="paydues-title">
    <div class="paydues-header">
      <h2 id="paydues-title">Pay Dues</h2>
      <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="closePayDues()"></button>
    </div>
    <iframe class="paydues-frame" [src]="payDuesFrameUrl" title="Pay dues — secure Square checkout"
            allow="payment" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <p class="paydues-help">Checkout not loading?
      <a [href]="payDuesUrl" target="_blank" rel="noopener">Open the secure checkout in a new tab</a></p>
  </div>
}
